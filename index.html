<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>答案之书 | Book of Answers</title>
  <style>
    :root {
      --bg-deep: #0a0e17;
      --bg-mid: #131826;
      --gold: #d4af37;
      --gold-light: #f0d77b;
      --gold-dark: #a8862a;
      --paper: #f5f0e6;
      --paper-dark: #e8dcc8;
      --leather: #3d2b1f;
      --leather-dark: #2a1c12;
      --ink: #2b2016;
      --ink-light: #5d4a35;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "FangSong", serif;
      background: radial-gradient(ellipse at 50% 30%, #1e2436 0%, var(--bg-mid) 40%, var(--bg-deep) 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 氛围光晕 */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 120vw;
      height: 60vh;
      background: radial-gradient(ellipse, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* 底部渐晕 */
    body::after {
      content: '';
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30vh;
      background: linear-gradient(to top, rgba(10, 14, 23, 0.9) 0%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* 微粒画布 */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    /* 书本场景 */
    .book-scene {
      perspective: 2200px;
      perspective-origin: 50% 50%;
      width: 100%;
    }

    .book {
      position: relative;
      width: 100%;
      height: 680px;
      transform-style: preserve-3d;
      transform: rotateX(4deg);
      transition: transform 0.6s ease;
    }

    /* 书本底座阴影 */
    .book-shadow {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 40px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, transparent 70%);
      filter: blur(8px);
      z-index: -1;
    }

    /* 书脊 */
    .book-spine {
      position: absolute;
      left: -28px;
      top: 0;
      width: 28px;
      height: 100%;
      background: linear-gradient(to right, var(--leather-dark), var(--leather));
      border-radius: 4px 0 0 4px;
      transform: rotateY(-90deg) translateX(-14px);
      transform-origin: right center;
      box-shadow: inset -5px 0 15px rgba(0,0,0,0.4);
    }

    .book-spine::after {
      content: '';
      position: absolute;
      top: 20px;
      bottom: 20px;
      left: 8px;
      right: 8px;
      border-top: 1px solid rgba(212,175,55,0.3);
      border-bottom: 1px solid rgba(212,175,55,0.3);
    }

    /* 页面堆叠效果 */
    .page-stack {
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      background: linear-gradient(to bottom, var(--paper-dark), var(--paper));
      border-radius: 2px 8px 8px 2px;
      box-shadow:
        -2px 2px 0 var(--paper-dark),
        -4px 4px 0 var(--paper-dark),
        -6px 6px 0 var(--paper-dark),
        -8px 8px 0 rgba(0,0,0,0.1);
      z-index: -1;
    }

    /* 页面基础样式 */
    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 1.4s cubic-bezier(0.4, 0.0, 0.2, 1);
      cursor: pointer;
    }

    .page.current {
      z-index: 10;
    }

    .page.flipped {
      transform: rotateY(-180deg);
    }

    .page-front,
    .page-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 2px 10px 10px 2px;
      overflow: hidden;
    }

    .page-front {
      background:
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.4) 0%, transparent 50%),
        linear-gradient(135deg, var(--paper) 0%, var(--paper-dark) 100%);
      box-shadow:
        inset 3px 0 15px rgba(0,0,0,0.08),
        inset -3px 0 10px rgba(0,0,0,0.05),
        0 10px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 50px 40px;
      position: relative;
    }

    /* 纸张纹理 */
    .page-front::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(139, 105, 60, 0.03) 28px, rgba(139, 105, 60, 0.03) 29px);
      pointer-events: none;
    }

    /* 页面边缘渐变 */
    .page-front::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 30px;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.12), transparent);
      pointer-events: none;
    }

    .page-back {
      transform: rotateY(180deg);
      background: linear-gradient(135deg, var(--paper-dark) 0%, var(--paper) 100%);
    }

    /* 翻页时的动态阴影 */
    .page.flipping .page-front::after {
      background: linear-gradient(to right, rgba(0,0,0,0.25), transparent);
      animation: shadowShift 1.4s ease;
    }

    @keyframes shadowShift {
      0% { opacity: 1; width: 30px; }
      50% { opacity: 0.6; width: 80px; }
      100% { opacity: 0; width: 0; }
    }

    /* ===== 封面 ===== */
    .cover-page .page-front {
      background:
        radial-gradient(ellipse at 30% 25%, rgba(255,255,255,0.1) 0%, transparent 40%),
        linear-gradient(145deg, var(--leather) 0%, var(--leather-dark) 100%);
      border: 1px solid rgba(212,175,55,0.2);
    }

    /* 封面皮革纹理 */
    .cover-page .page-front::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,0,0,0.1) 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,0.1) 1px, transparent 1px);
      background-size: 8px 8px, 12px 12px;
      opacity: 0.5;
    }

    /* 封面装饰边框 */
    .cover-border {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      bottom: 24px;
      border: 2px solid var(--gold);
      border-radius: 4px;
      pointer-events: none;
      box-shadow:
        inset 0 0 20px rgba(212,175,55,0.1),
        0 0 20px rgba(212,175,55,0.1);
    }

    .cover-border::before,
    .cover-border::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--gold);
    }

    .cover-border::before {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
    }

    .cover-border::after {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
    }

    .cover-content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 40px 20px;
    }

    .cover-ornament {
      color: var(--gold);
      font-size: 28px;
      margin-bottom: 24px;
      letter-spacing: 12px;
      opacity: 0.8;
    }

    .cover-title {
      color: var(--gold-light);
      font-size: 52px;
      font-weight: normal;
      letter-spacing: 16px;
      margin-bottom: 16px;
      text-shadow:
        0 0 20px rgba(212,175,55,0.5),
        0 2px 4px rgba(0,0,0,0.5);
      animation: titleGlow 3s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from { text-shadow: 0 0 20px rgba(212,175,55,0.4), 0 2px 4px rgba(0,0,0,0.5); }
      to { text-shadow: 0 0 35px rgba(240,215,123,0.7), 0 2px 4px rgba(0,0,0,0.5); }
    }

    .cover-subtitle {
      color: rgba(212,175,55,0.7);
      font-size: 16px;
      letter-spacing: 6px;
      margin-bottom: 48px;
    }

    .cover-divider {
      width: 120px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 0 auto 48px;
    }

    .start-btn {
      padding: 16px 52px;
      font-size: 17px;
      font-family: inherit;
      letter-spacing: 4px;
      color: var(--leather-dark);
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      border: none;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      box-shadow:
        0 4px 15px rgba(212,175,55,0.3),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .start-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.6s ease;
    }

    .start-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 8px 25px rgba(212,175,55,0.5),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .start-btn:hover::before {
      left: 100%;
    }

    /* ===== 输入页 ===== */
    .input-title {
      font-size: 26px;
      color: var(--ink);
      letter-spacing: 8px;
      margin-bottom: 12px;
      font-weight: normal;
    }

    .input-subtitle {
      font-size: 14px;
      color: var(--ink-light);
      letter-spacing: 2px;
      margin-bottom: 40px;
      opacity: 0.7;
    }

    .question-input {
      width: 100%;
      max-width: 400px;
      padding: 18px 24px;
      font-size: 18px;
      font-family: inherit;
      color: var(--ink);
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(139,105,60,0.3);
      border-bottom: 2px solid var(--gold-dark);
      border-radius: 4px 4px 0 0;
      outline: none;
      transition: all 0.3s ease;
      text-align: center;
      letter-spacing: 1px;
    }

    .question-input::placeholder {
      color: rgba(93,74,53,0.4);
      letter-spacing: 1px;
    }

    .question-input:focus {
      background: rgba(255,255,255,0.9);
      border-bottom-color: var(--gold);
      box-shadow: 0 8px 25px rgba(212,175,55,0.15);
    }

    .submit-btn {
      margin-top: 32px;
      padding: 14px 44px;
      font-size: 16px;
      font-family: inherit;
      letter-spacing: 3px;
      color: var(--paper);
      background: linear-gradient(135deg, var(--ink) 0%, var(--ink-light) 100%);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(43,32,22,0.4);
      border-color: var(--gold);
    }

    .input-hint {
      margin-top: 24px;
      font-size: 13px;
      color: var(--ink-light);
      opacity: 0.5;
      letter-spacing: 1px;
    }

    /* ===== 答案页 ===== */
    .answer-ornament {
      color: var(--gold-dark);
      font-size: 24px;
      letter-spacing: 10px;
      margin-bottom: 32px;
      opacity: 0.6;
    }

    .answer-label {
      font-size: 13px;
      color: var(--ink-light);
      letter-spacing: 6px;
      margin-bottom: 24px;
      opacity: 0.6;
      text-transform: uppercase;
    }

    .answer-content {
      font-size: 34px;
      color: var(--ink);
      text-align: center;
      line-height: 1.6;
      letter-spacing: 3px;
      max-width: 400px;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.8s ease 0.8s, transform 0.8s ease 0.8s;
    }

    .answer-page.current .answer-content {
      opacity: 1;
      transform: translateY(0);
    }

    .answer-content.category-positive { color: #4a7c59; }
    .answer-content.category-negative { color: #8b4a4a; }
    .answer-content.category-neutral { color: var(--ink); }
    .answer-content.category-humor { color: #9c6b30; }
    .answer-content.category-mystery { color: #5d5470; }

    .answer-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dark), transparent);
      margin-bottom: 32px;
    }

    .page-actions {
      display: flex;
      gap: 24px;
      margin-top: 8px;
    }

    .action-btn {
      padding: 12px 32px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 2px;
      color: var(--ink-light);
      background: transparent;
      border: 1px solid rgba(139,105,60,0.4);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      color: var(--paper);
      background: var(--ink);
      border-color: var(--ink);
      transform: translateY(-2px);
    }

    .action-btn.primary {
      color: var(--paper);
      background: var(--ink);
      border-color: var(--ink);
    }

    .action-btn.primary:hover {
      background: var(--ink-light);
      box-shadow: 0 4px 15px rgba(43,32,22,0.3);
    }

    .page-number {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--ink-light);
      opacity: 0.4;
      letter-spacing: 2px;
    }

    /* ===== 底部提示 ===== */
    .footer-hint {
      text-align: center;
      margin-top: 32px;
      color: rgba(212,175,55,0.4);
      font-size: 13px;
      letter-spacing: 3px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      .book { height: 560px; }
      .cover-title { font-size: 40px; letter-spacing: 10px; }
      .cover-subtitle { font-size: 14px; }
      .page-front { padding: 36px 28px; }
      .answer-content { font-size: 28px; }
      .input-title { font-size: 22px; }
      .book-spine { width: 20px; left: -20px; }
    }

    @media (max-width: 400px) {
      .book { height: 500px; }
      .cover-title { font-size: 34px; letter-spacing: 6px; }
      .answer-content { font-size: 24px; }
      .page-actions { flex-direction: column; gap: 12px; }
      .action-btn { width: 100%; }
    }

    /* 减少动效 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      #particles { display: none; }
    }
  </style>
</head>

    // 状态管理
    const state = {
      currentPage: 0,
      isFlipping: false,
      history: [],
      pageNumber: 1
    };

    // DOM 引用
    const els = {
      cover: document.querySelector('.cover-page'),
      input: document.querySelector('.input-page'),
      answer: document.querySelector('.answer-page'),
      questionInput: document.getElementById('questionInput'),
      answerContent: document.getElementById('answerContent'),
      pageNum: document.getElementById('pageNum')
    };

    // 哈希函数
    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return Math.abs(hash);
    }

    // 获取答案
    function getAnswer(input) {
      if (/^\d+$/.test(input)) {
        const num = parseInt(input);
        if (num > 0 && num <= ANSWERS.length) {
          return ANSWERS[num - 1];
        }
      }
      const hash = simpleHash(input);
      return ANSWERS[hash % ANSWERS.length];
    }

    // 翻页到答案
    function flipToAnswer(answer) {
      if (state.isFlipping) return;
      state.isFlipping = true;

      els.answerContent.textContent = answer.text;
      els.answerContent.className = `answer-content category-${answer.category}`;
      els.pageNum.textContent = state.pageNumber;

      els.input.classList.add('flipping');

      setTimeout(() => {
        els.input.classList.remove('current', 'flipping');
        els.input.classList.add('flipped');
        els.answer.classList.add('current');
        state.isFlipping = false;
        state.currentPage = 2;
      }, 1400);

      addToHistory(answer);
      state.pageNumber++;
    }

    // 返回输入页
    function flipToInput() {
      if (state.isFlipping) return;
      state.isFlipping = true;

      els.answer.classList.add('flipping');

      setTimeout(() => {
        els.answer.classList.remove('current', 'flipping');
        els.answer.classList.add('flipped');
        els.input.classList.remove('flipped');
        els.input.classList.add('current');
        state.isFlipping = false;
        state.currentPage = 1;
        els.questionInput.value = '';
        els.questionInput.focus();
      }, 1400);
    }

    // 历史记录
    function addToHistory(answer) {
      state.history.push({
        answer: answer.text,
        category: answer.category,
        timestamp: Date.now()
      });
      if (state.history.length > 20) {
        state.history = state.history.slice(-20);
      }
      localStorage.setItem('book-history', JSON.stringify(state.history));
    }

    // 提交处理
    function handleSubmit() {
      const input = els.questionInput.value.trim();
      if (!input) return;
      const answer = getAnswer(input);
      flipToAnswer(answer);
    }

    // 粒子系统
    function initParticles() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      if (reducedMotion) return;

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = -Math.random() * 0.5 - 0.1;
          this.opacity = Math.random() * 0.5 + 0.1;
          this.fadeSpeed = Math.random() * 0.005 + 0.002;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          this.opacity -= this.fadeSpeed;
          if (this.opacity <= 0 || this.y < -10) {
            this.reset();
            this.y = canvas.height + 10;
          }
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < 40; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }
      animate();
    }

    // 事件绑定
    document.addEventListener('DOMContentLoaded', () => {
      initParticles();

      // 封面 -> 输入页
      document.getElementById('startBtn').addEventListener('click', () => {
        els.cover.classList.remove('current');
        els.cover.classList.add('flipped');
        els.input.classList.add('current');
        state.currentPage = 1;
        setTimeout(() => els.questionInput.focus(), 400);
      });

      // 提交
      document.getElementById('submitBtn').addEventListener('click', handleSubmit);
      els.questionInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSubmit();
      });

      // 返回 / 再问
      document.getElementById('backBtn').addEventListener('click', flipToInput);
      document.getElementById('nextBtn').addEventListener('click', flipToInput);

      // 加载历史
      const savedHistory = localStorage.getItem('book-history');
      if (savedHistory) {
        try {
          state.history = JSON.parse(savedHistory);
        } catch (e) {
          state.history = [];
        }
      }
    });

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>答案之书 | Book of Answers</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "KaiTi", "楷体", "STKaiti", "华文楷体", serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 700px;
    }

    .book-container {
      perspective: 1500px;
      perspective-origin: 50% 50%;
      width: 100%;
      height: 800px;
      position: relative;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1.000);
      backface-visibility: hidden;
    }

    .page.current {
      z-index: 10;
    }

    .page.flipped {
      transform: rotateY(-180deg);
    }

    .page-front,
    .page-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
      overflow: hidden;
    }

    .page-front {
      background:
        repeating-linear-gradient(
          transparent,
          transparent 39px,
          rgba(0,0,0,0.05) 39px,
          rgba(0,0,0,0.05) 40px
        ),
        linear-gradient(to bottom, #f4f1ea 0%, #ebe7df 100%);
      box-shadow:
        inset -2px 0 8px rgba(0,0,0,0.1),
        inset 2px 0 8px rgba(0,0,0,0.05),
        0 0 20px rgba(0,0,0,0.3);
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .page-back {
      transform: rotateY(180deg);
      background: linear-gradient(to bottom, #ebe7df 0%, #f4f1ea 100%);
    }

    /* 封面样式 */
    .cover-page .page-front {
      background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
      color: #D4AF37;
      text-align: center;
    }

    .cover-page h1 {
      font-size: 56px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      letter-spacing: 8px;
    }

    .cover-page .subtitle {
      font-size: 20px;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    .start-btn {
      padding: 15px 40px;
      font-size: 18px;
      background: #D4AF37;
      color: #654321;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    /* 输入页样式 */
    .input-page .page-front {
      background:
        repeating-linear-gradient(
          transparent,
          transparent 39px,
          rgba(0,0,0,0.05) 39px,
          rgba(0,0,0,0.05) 40px
        ),
        linear-gradient(to bottom, #f4f1ea 0%, #ebe7df 100%);
    }

    .input-page h2 {
      font-size: 32px;
      color: #654321;
      margin-bottom: 40px;
      text-align: center;
    }

    .question-input {
      width: 100%;
      max-width: 500px;
      padding: 15px 20px;
      font-size: 18px;
      border: 2px solid #8B4513;
      border-radius: 8px;
      background: rgba(255,255,255,0.8);
      font-family: inherit;
      margin-bottom: 30px;
      outline: none;
      transition: all 0.3s;
    }

    .question-input:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 10px rgba(212,175,55,0.3);
    }

    .submit-btn {
      padding: 12px 35px;
      font-size: 18px;
      background: #8B4513;
      color: #f4f1ea;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.3s;
    }

    .submit-btn:hover {
      background: #654321;
      transform: translateY(-2px);
    }

    /* 答案页样式 */
    .answer-page .page-front {
      background:
        repeating-linear-gradient(
          transparent,
          transparent 39px,
          rgba(0,0,0,0.05) 39px,
          rgba(0,0,0,0.05) 40px
        ),
        linear-gradient(to bottom, #f4f1ea 0%, #ebe7df 100%);
      position: relative;
    }

    .answer-content {
      font-size: 32px;
      color: #654321;
      text-align: center;
      line-height: 1.8;
      margin-bottom: 40px;
      padding: 40px;
      max-width: 500px;
    }

    .answer-content.category-positive {
      color: #2e7d32;
    }

    .answer-content.category-negative {
      color: #c62828;
    }

    .answer-content.category-neutral {
      color: #654321;
    }

    .answer-content.category-humor {
      color: #f57c00;
    }

    .answer-content.category-mystery {
      color: #6a1b9a;
    }

    .page-actions {
      display: flex;
      gap: 20px;
    }

    .back-btn,
    .next-btn {
      padding: 10px 25px;
      font-size: 16px;
      border: 2px solid #8B4513;
      background: transparent;
      color: #8B4513;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
    }

    .back-btn:hover,
    .next-btn:hover {
      background: #8B4513;
      color: #f4f1ea;
    }

    .page-number {
      position: absolute;
      bottom: 30px;
      right: 40px;
      font-size: 14px;
      color: #999;
    }

    /* 翻页阴影效果 */
    .page::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right,
        rgba(0,0,0,0.1) 0%,
        rgba(0,0,0,0) 10%,
        rgba(0,0,0,0) 90%,
        rgba(0,0,0,0.1) 100%);
      opacity: 0;
      transition: opacity 0.6s;
      pointer-events: none;
      z-index: 100;
    }

    .page.flipping::before {
      opacity: 1;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .book-container {
        height: 70vh;
      }

      .page-front {
        padding: 40px;
      }

      .cover-page h1 {
        font-size: 42px;
      }

      .cover-page .subtitle {
        font-size: 16px;
      }

      .input-page h2 {
        font-size: 26px;
      }

      .answer-content {
        font-size: 26px;
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      .book-container {
        height: 60vh;
      }

      .page-front {
        padding: 20px;
      }

      .cover-page h1 {
        font-size: 32px;
        letter-spacing: 4px;
      }

      .cover-page .subtitle {
        font-size: 14px;
      }

      .input-page h2 {
        font-size: 22px;
      }

      .question-input {
        font-size: 16px;
        padding: 12px 15px;
      }

      .answer-content {
        font-size: 22px;
        padding: 10px;
      }

      .back-btn,
      .next-btn {
        padding: 8px 20px;
        font-size: 14px;
      }
    }

    /* 隐藏非当前页 */
    .page:not(.current) {
      pointer-events: none;
    }
  </style>
</head>

    // 状态管理
    const state = {
      currentPage: 0,
      isFlipping: false,
      history: [],
      pageNumber: 1
    };

    // 简单哈希函数
    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return Math.abs(hash);
    }

    // 获取答案
    function getAnswer(input) {
      // 方式 1：数字直接索引
      if (/^\d+$/.test(input)) {
        const num = parseInt(input);
        if (num > 0 && num <= ANSWERS.length) {
          return ANSWERS[num - 1];
        }
      }

      // 方式 2：问题哈希索引
      const hash = simpleHash(input);
      const index = hash % ANSWERS.length;
      return ANSWERS[index];
    }

    // 翻页到答案
    function flipToAnswer(answer) {
      if (state.isFlipping) return;

      state.isFlipping = true;
      const inputPage = document.querySelector('.input-page');
      const answerPage = document.querySelector('.answer-page');
      const answerContent = answerPage.querySelector('.answer-content');
      const pageNumberSpan = answerPage.querySelector('.current-page-num');

      // 设置答案内容
      answerContent.textContent = answer.text;
      answerContent.className = `answer-content category-${answer.category}`;
      pageNumberSpan.textContent = state.pageNumber;

      // 开始翻页动画
      inputPage.classList.add('flipping');

      setTimeout(() => {
        inputPage.classList.remove('current', 'flipping');
        inputPage.classList.add('flipped');
        answerPage.classList.add('current');
        state.isFlipping = false;
        state.currentPage = 2;
      }, 1200);

      // 添加到历史记录
      addToHistory(answer);
      state.pageNumber++;
    }

    // 返回输入页
    function flipToInput() {
      if (state.isFlipping) return;

      state.isFlipping = true;
      const inputPage = document.querySelector('.input-page');
      const answerPage = document.querySelector('.answer-page');

      answerPage.classList.add('flipping');

      setTimeout(() => {
        answerPage.classList.remove('current', 'flipping');
        answerPage.classList.add('flipped');
        inputPage.classList.remove('flipped');
        inputPage.classList.add('current');
        state.isFlipping = false;
        state.currentPage = 1;

        // 清空输入框
        document.querySelector('.question-input').value = '';
        document.querySelector('.question-input').focus();
      }, 1200);
    }

    // 添加到历史记录
    function addToHistory(answer) {
      state.history.push({
        answer: answer.text,
        category: answer.category,
        timestamp: Date.now()
      });
      // 只保留最近20条
      if (state.history.length > 20) {
        state.history = state.history.slice(-20);
      }
      localStorage.setItem('book-history', JSON.stringify(state.history));
    }

    // 提交处理
    function handleSubmit() {
      const input = document.querySelector('.question-input').value.trim();
      if (!input) return;

      const answer = getAnswer(input);
      flipToAnswer(answer);
    }

    // 事件绑定
    document.addEventListener('DOMContentLoaded', () => {
      // 封面 -> 输入页
      document.querySelector('.start-btn').addEventListener('click', () => {
        const cover = document.querySelector('.cover-page');
        const inputPage = document.querySelector('.input-page');

        cover.classList.remove('current');
        cover.classList.add('flipped');
        inputPage.classList.add('current');
        state.currentPage = 1;

        setTimeout(() => {
          document.querySelector('.question-input').focus();
        }, 300);
      });

      // 提交答案
      document.querySelector('.submit-btn').addEventListener('click', handleSubmit);
      document.querySelector('.question-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleSubmit();
        }
      });

      // 返回按钮
      document.querySelector('.back-btn').addEventListener('click', flipToInput);

      // 再翻一页
      document.querySelector('.next-btn').addEventListener('click', flipToInput);

      // 加载历史记录
      const savedHistory = localStorage.getItem('book-history');
      if (savedHistory) {
        try {
          state.history = JSON.parse(savedHistory);
        } catch (e) {
          state.history = [];
        }
      }
    });
  </script>
